name: RRCE ERP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres.gnlhurzzowhyrqqnoxqn:uCgfSPHJaHYeA8fT@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"
      JWT_SECRET: "ci_pipeline_jwt_verification_secret_2025"
      SEED_SECRET: "ci_seed_secret_2025"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Strict Mode Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
