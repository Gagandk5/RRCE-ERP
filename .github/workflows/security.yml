name: Security Scan & Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  audit:
    name: Dependency Audit & CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high || true
